name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".gitignore", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".gitignore", "LICENSE"]

permissions:
  contents: read
  packages: read

jobs:
  build:
    uses: Pruthvik007/github-workflows/.github/workflows/node-app.yml@main
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      BUILD_ENV: TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
